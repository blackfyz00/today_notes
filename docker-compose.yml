# docker-compose.yml
version: '3.8'
services:
  db:
    image: postgres:16
    container_name: notes-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d  # ← Автоматический запуск SQL-скриптов
      - pgdata:/var/lib/postgresql/data      # ← Сохранение данных между перезапусками
volumes:
  pgdata: